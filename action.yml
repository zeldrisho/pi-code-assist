name: Pi Code Assist
description: Composable GitHub Action for running the Pi coding agent in non-interactive workflows
branding:
  icon: terminal
  color: purple

inputs:
  prompt:
    description: Instruction to send to Pi
    required: true
  api-key:
    description: API key for the selected model provider
    required: true
  provider:
    description: Pi provider name, such as opencode
    required: true
  model:
    description: Model ID or pattern accepted by Pi
    required: true
  thinking:
    description: Optional thinking-level override (off, minimal, low, medium, high, xhigh, or max)
    required: false
  tools:
    description: Comma-separated Pi tool allowlist; use all to keep Pi defaults
    required: false
    default: read,grep,find,ls
  project-trust:
    description: Whether to trust and load project-local Pi settings and executable extensions
    required: false
    default: 'false'
  packages:
    description: Exact-pinned npm/git Pi packages or ./-prefixed workspace package paths, one per line
    required: false
  github-tools:
    description: GitHub tools to expose to Pi (none, read, or write)
    required: false
    default: none
  pi-version:
    description: Exact @earendil-works/pi-coding-agent version to install
    required: true
  setup-vp:
    description: Whether to install the action's pinned Vite+ and Node versions
    required: false
    default: 'true'
  install-timeout:
    description: Maximum seconds allowed for Pi installation (1-86400)
    required: false
    default: '300'
  execution-timeout:
    description: Maximum seconds allowed for the Pi/model invocation (1-86400)
    required: false
    default: '600'
  working-directory:
    description: Directory under GITHUB_WORKSPACE in which Pi runs
    required: false
    default: .

outputs:
  response:
    description: Pi's final text response
    value: ${{ steps.pi.outputs.response }}
  response-path:
    description: Absolute path containing Pi's final text response
    value: ${{ steps.pi.outputs.response-path }}

runs:
  using: composite
  steps:
    - name: Set up Vite+
      if: inputs.setup-vp == 'true'
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
      with:
        node-version: '24.18.0'
        cache: false
        run-install: false

    - name: Install the action runtime
      shell: bash
      working-directory: ${{ github.action_path }}
      run: vp install --prod --frozen-lockfile --ignore-scripts

    - id: pi
      name: Run Pi
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PI_AGENT_INPUT_PROMPT: ${{ inputs.prompt }}
        PI_AGENT_INPUT_API_KEY: ${{ inputs.api-key }}
        PI_AGENT_INPUT_PROVIDER: ${{ inputs.provider }}
        PI_AGENT_INPUT_MODEL: ${{ inputs.model }}
        PI_AGENT_INPUT_THINKING: ${{ inputs.thinking }}
        PI_AGENT_INPUT_TOOLS: ${{ inputs.tools }}
        PI_AGENT_INPUT_PROJECT_TRUST: ${{ inputs.project-trust }}
        PI_AGENT_INPUT_PACKAGES: ${{ inputs.packages }}
        PI_AGENT_GITHUB_TOKEN: ${{ inputs.github-tools != 'none' && github.token || '' }}
        PI_AGENT_INPUT_GITHUB_TOOLS: ${{ inputs.github-tools }}
        PI_AGENT_INPUT_VERSION: ${{ inputs.pi-version }}
        PI_AGENT_INPUT_INSTALL_TIMEOUT: ${{ inputs.install-timeout }}
        PI_AGENT_INPUT_EXECUTION_TIMEOUT: ${{ inputs.execution-timeout }}
        PI_AGENT_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: vp exec tsx scripts/run.ts
