name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run shared validation suite
        run: ./scripts/validate.sh

      - name: Create fake Pi executable
        env:
          FAKE_PI: ${{ runner.temp }}/fake-pi
        run: |
          printf '#!/usr/bin/env bash\nprintf "integration test passed\\n"\n' > "$FAKE_PI"
          chmod +x "$FAKE_PI"

      - name: Test action metadata and composition
        env:
          PI_AGENT_TEST_BIN: ${{ runner.temp }}/fake-pi
          PI_AGENT_TEST_ARGS: ${{ runner.temp }}/fake-pi-args
        uses: ./
        with:
          prompt: Review the action.
          provider: opencode
          model: deepseek-v4-flash-free
