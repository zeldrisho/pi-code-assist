name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1' # Weekly Pi installation and compatibility check.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: '24.18.0'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp check
      - run: vp test
      - run: vp build

      - id: composition
        name: Test action metadata and composition
        continue-on-error: true
        uses: ./
        with:
          prompt: Review the action.
          api-key: integration-test-key
          provider: opencode
          model: integration-test
          pi-version: latest

      - name: Verify composition rejected the invalid version before installation
        if: steps.composition.outcome != 'failure'
        shell: bash
        run: exit 1
