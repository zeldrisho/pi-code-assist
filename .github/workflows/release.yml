name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: '24.18.0'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp check
      - run: vp test
      - run: vp build

      - id: composition
        name: Test action metadata and composition
        continue-on-error: true
        uses: ./
        with:
          prompt: Validate the release action.
          api-key: integration-test-key
          provider: opencode
          model: integration-test
          pi-version: latest

      - name: Verify composition rejected the invalid version before installation
        if: steps.composition.outcome != 'failure'
        shell: bash
        run: exit 1

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          release-type: simple
