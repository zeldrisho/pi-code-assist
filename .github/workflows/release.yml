name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run shared validation suite
        run: ./scripts/validate.sh

      - name: Create fake Pi executable
        env:
          FAKE_PI: ${{ runner.temp }}/fake-pi
        run: |
          printf '#!/usr/bin/env bash\nprintf "integration test passed\\n"\n' > "$FAKE_PI"
          chmod +x "$FAKE_PI"

      - name: Test action metadata and composition
        env:
          PI_AGENT_TEST_BIN: ${{ runner.temp }}/fake-pi
          PI_AGENT_TEST_ARGS: ${{ runner.temp }}/fake-pi-args
        uses: ./
        with:
          prompt: Validate the release action.

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
