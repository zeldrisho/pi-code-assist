name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: '24.18.0'
          cache: true

      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp check
      - run: vp test
      - run: vp build

      - name: Test action metadata and composition
        env:
          PI_AGENT_TEST_BIN: ${{ github.workspace }}/node_modules/.bin/tsx
          PI_AGENT_TEST_SCRIPT: ${{ github.workspace }}/tests/fake-pi.ts
          PI_AGENT_TEST_ARGS: ${{ runner.temp }}/fake-pi-args
        uses: ./
        with:
          prompt: Validate the release action.
          api-key: integration-test-key
          provider: opencode
          model: deepseek-v4-flash-free
          pi-version: 0.80.10

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          release-type: simple
